# Smart Traffic Platform - GraphQL operations
# Endpoint principal frontend: http://localhost:4000/graphql
# Ajouter le header suivant pour les operations protegees:
# Authorization: Bearer <accessToken>

fragment UserFields on UserEntity {
  id
  email
  firstName
  lastName
  role
  createdAt
  updatedAt
}

fragment AuthPayloadFields on AuthPayloadEntity {
  accessToken
  refreshToken
  user {
    ...UserFields
  }
}

fragment VehicleFields on VehicleEntity {
  id
  matricule
  brand
  model
  type
  status
  createdAt
  updatedAt
}

fragment VehiclePositionFields on VehiclePositionEntity {
  id
  vehicleId
  latitude
  longitude
  speed
  recordedAt
}

fragment TrafficZoneFields on TrafficZoneEntity {
  id
  name
  description
  latitude
  longitude
  radius
  vehicleCount
  density
  congestionLevel
  isCongested
  createdAt
  updatedAt
}

fragment NotificationFields on NotificationEntity {
  id
  title
  message
  type
  isRead
  userId
  createdAt
  updatedAt
}

fragment IncidentFields on IncidentEntity {
  id
  title
  description
  type
  status
  latitude
  longitude
  address
  createdAt
  updatedAt
}

# -----------------------------------------------------------------------------
# Auth
# -----------------------------------------------------------------------------

mutation Register($input: RegisterInput!) {
  register(input: $input) {
    ...AuthPayloadFields
  }
}

mutation Login($input: LoginInput!) {
  login(input: $input) {
    ...AuthPayloadFields
  }
}

mutation RefreshToken($input: RefreshTokenInput!) {
  refreshToken(input: $input) {
    ...AuthPayloadFields
  }
}

mutation Logout($input: RefreshTokenInput!) {
  logout(input: $input)
}

query Me {
  me {
    ...UserFields
  }
}

query Users($take: Int = 50, $skip: Int = 0) {
  users(take: $take, skip: $skip) {
    ...UserFields
  }
}

# -----------------------------------------------------------------------------
# Vehicle
# -----------------------------------------------------------------------------

query Vehicles {
  vehicles {
    ...VehicleFields
  }
}

query Vehicle($id: ID!) {
  vehicle(id: $id) {
    ...VehicleFields
  }
}

query VehiclePositions($vehicleId: ID!) {
  vehiclePositions(vehicleId: $vehicleId) {
    ...VehiclePositionFields
  }
}

query VehiclePositionCount {
  vehiclePositionCount
}

mutation CreateVehicle($input: CreateVehicleInput!) {
  createVehicle(input: $input) {
    ...VehicleFields
  }
}

mutation UpdateVehicle($id: ID!, $input: UpdateVehicleInput!) {
  updateVehicle(id: $id, input: $input) {
    ...VehicleFields
  }
}

mutation DeleteVehicle($id: ID!) {
  deleteVehicle(id: $id)
}

mutation AddVehiclePosition($input: AddVehiclePositionInput!) {
  addVehiclePosition(input: $input) {
    ...VehiclePositionFields
  }
}

mutation SimulateVehiclePosition($vehicleId: ID!) {
  simulateVehiclePosition(vehicleId: $vehicleId) {
    ...VehiclePositionFields
  }
}

