name: Smart Traffic Platform CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: "22"
  NEXT_PUBLIC_GRAPHQL_GATEWAY_URL: http://localhost:4000/graphql
  GRAPHQL_GATEWAY_URL: http://localhost:4000/graphql
  DATABASE_URL: postgresql://smart_traffic:smart_traffic_password@localhost:5432/smart_traffic?schema=public
  JWT_SECRET: ci_access_secret
  JWT_REFRESH_SECRET: ci_refresh_secret
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d

jobs:
  install-dependencies:
    name: Install dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: frontend
            path: frontend/smart-traffic-dashboard
          - name: api-gateway
            path: backend/api-gateway
          - name: auth-service
            path: backend/auth-service
          - name: vehicle-service
            path: backend/vehicle-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json

      - name: Install ${{ matrix.app.name }} dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install-dependencies
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: frontend
            path: frontend/smart-traffic-dashboard
            command: npm run lint -- --max-warnings=0
          - name: api-gateway
            path: backend/api-gateway
            command: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0
          - name: auth-service
            path: backend/auth-service
            command: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0
          - name: vehicle-service
            path: backend/vehicle-service
            command: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json

      - name: Install ${{ matrix.app.name }} dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm ci

      - name: Run ${{ matrix.app.name }} lint
        working-directory: ${{ matrix.app.path }}
        run: ${{ matrix.app.command }}

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: install-dependencies
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: frontend
            path: frontend/smart-traffic-dashboard
            command: npm run test
          - name: api-gateway
            path: backend/api-gateway
            command: npm test -- --runInBand
          - name: auth-service
            path: backend/auth-service
            command: npm test -- --runInBand
          - name: vehicle-service
            path: backend/vehicle-service
            command: npm test -- --runInBand
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json

      - name: Install ${{ matrix.app.name }} dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm ci

      - name: Generate Prisma client if needed
        working-directory: ${{ matrix.app.path }}
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Run ${{ matrix.app.name }} unit tests
        working-directory: ${{ matrix.app.path }}
        run: ${{ matrix.app.command }}

  build-backend:
    name: Build backend services
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: backend/api-gateway
          - name: auth-service
            path: backend/auth-service
          - name: vehicle-service
            path: backend/vehicle-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.service.path }}/package-lock.json

      - name: Install ${{ matrix.service.name }} dependencies
        working-directory: ${{ matrix.service.path }}
        run: npm ci

      - name: Generate Prisma client if needed
        working-directory: ${{ matrix.service.path }}
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Build ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.path }}
        run: npm run build

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/smart-traffic-dashboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/smart-traffic-dashboard
        run: npm ci

      - name: Build frontend
        working-directory: frontend/smart-traffic-dashboard
        run: npm run build

  docker-compose-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Compose services
        run: docker compose build
