services:
  database:
    image: postgres:16-alpine
    container_name: smart-traffic-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_traffic
      POSTGRES_USER: smart_traffic
      POSTGRES_PASSWORD: smart_traffic_password
    ports:
      - "5432:5432"
    volumes:
      - smart_traffic_postgres_data:/var/lib/postgresql/data
    networks:
      - smart-traffic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_traffic -d smart_traffic"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: smart-traffic-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://smart_traffic:smart_traffic_password@database:5432/smart_traffic?schema=public
      JWT_SECRET: local_dev_access_secret_change_me
      JWT_REFRESH_SECRET: local_dev_refresh_secret_change_me
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000,http://frontend:3000,http://localhost:4000
    ports:
      - "3002:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - smart-traffic-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/graphql', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  vehicle-service:
    build:
      context: ./backend/vehicle-service
      dockerfile: Dockerfile
    container_name: smart-traffic-vehicle-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://smart_traffic:smart_traffic_password@database:5432/smart_traffic?schema=public
    ports:
      - "3003:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - smart-traffic-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  traffic-service:
    build:
      context: ./backend/traffic-service
      dockerfile: Dockerfile
    container_name: smart-traffic-traffic-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://smart_traffic:smart_traffic_password@database:5432/smart_traffic?schema=public
      NOTIFICATION_SERVICE_GRAPHQL_URL: http://notification-service:3000/graphql
    ports:
      - "3004:3000"
    depends_on:
      database:
        condition: service_healthy
      notification-service:
        condition: service_started
    networks:
      - smart-traffic-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/graphql', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: smart-traffic-notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://smart_traffic:smart_traffic_password@database:5432/smart_traffic?schema=public
      JWT_SECRET: local_dev_access_secret_change_me
      CORS_ORIGIN: http://localhost:3000,http://frontend:3000,http://localhost:4000
    ports:
      - "3005:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - smart-traffic-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/graphql', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  incident-service:
    build:
      context: ./backend/incident-service
      dockerfile: Dockerfile
    container_name: smart-traffic-incident-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://smart_traffic:smart_traffic_password@database:5432/smart_traffic?schema=public
      NOTIFICATION_SERVICE_GRAPHQL_URL: http://notification-service:3000/graphql
    ports:
      - "3006:3000"
    depends_on:
      database:
        condition: service_healthy
      notification-service:
        condition: service_started
    networks:
      - smart-traffic-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/graphql', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: smart-traffic-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_GRAPHQL_URL: http://auth-service:3000/graphql
      VEHICLE_SERVICE_GRAPHQL_URL: http://vehicle-service:3000/graphql
      TRAFFIC_SERVICE_GRAPHQL_URL: http://traffic-service:3000/graphql
      NOTIFICATION_SERVICE_GRAPHQL_URL: http://notification-service:3000/graphql
      INCIDENT_SERVICE_GRAPHQL_URL: http://incident-service:3000/graphql
      DATABASE_URL: postgresql://smart_traffic:smart_traffic_password@database:5432/smart_traffic?schema=public
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:3000"
    depends_on:
      database:
        condition: service_healthy
      auth-service:
        condition: service_started
      vehicle-service:
        condition: service_started
      traffic-service:
        condition: service_started
      notification-service:
        condition: service_started
      incident-service:
        condition: service_started
    networks:
      - smart-traffic-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend/smart-traffic-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_GATEWAY_URL: http://localhost:4000/graphql
        NEXT_PUBLIC_NOTIFICATION_WS_URL: http://localhost:3005/notifications
    container_name: smart-traffic-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      GRAPHQL_GATEWAY_URL: http://api-gateway:3000/graphql
      NEXT_PUBLIC_GRAPHQL_GATEWAY_URL: http://localhost:4000/graphql
      NEXT_PUBLIC_NOTIFICATION_WS_URL: http://localhost:3005/notifications
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - smart-traffic-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  smart-traffic-network:
    driver: bridge

volumes:
  smart_traffic_postgres_data:

